name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild app meski tidak ada perubahan kode"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Siapkan SSH
        env:
          VPS_SSH_KEY: "${{ secrets.VPS_SSH_KEY }}"
          VPS_KNOWN_HOSTS: "${{ secrets.VPS_KNOWN_HOSTS }}"
          VPS_HOST: "${{ secrets.VPS_HOST }}"
          VPS_PORT: "${{ secrets.VPS_PORT || '22' }}"
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$VPS_PORT" -t ed25519,rsa "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy ke VPS
        env:
          VPS_HOST: "${{ secrets.VPS_HOST }}"
          VPS_USER: "${{ secrets.VPS_USER }}"
          VPS_PORT: "${{ secrets.VPS_PORT || '22' }}"
          DEPLOY_COMMAND: "${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true && 'force' || 'deploy' }}"
        run: |
          set -euo pipefail
          ssh -T -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$VPS_USER@$VPS_HOST" "$DEPLOY_COMMAND"
